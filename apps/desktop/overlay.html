<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self';" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GenQuantaa Copilot</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#f5f6ef;background:transparent}.panel{margin:10px;padding:15px 17px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(12,15,14,.95);box-shadow:0 18px 50px rgba(0,0,0,.35);-webkit-app-region:drag}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:.02em}.status{font-size:11px;color:#b9c1ba}.question{margin-top:10px;font-size:12px;color:#aeb7b0;line-height:1.35;max-height:42px;overflow:hidden}.answer{margin-top:9px;line-height:1.45;font-size:14px;color:#e4e8df;min-height:50px;max-height:110px;overflow:auto;white-space:pre-wrap}.meta{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:10px;color:#aeb7b0}.confidence{font-weight:800;color:#e8ef49}.sources{display:flex;gap:5px;overflow:hidden;white-space:nowrap}.source{padding:3px 6px;border-radius:6px;background:#252b28;color:#dfe4db}.actions{display:flex;gap:8px;margin-top:10px;-webkit-app-region:no-drag}button{border:0;border-radius:10px;padding:8px 11px;background:#e8ef49;color:#11140f;font-weight:700;cursor:pointer}button.secondary{background:#252b28;color:#dfe4db;border:1px solid #3a423e}
</style></head>
<body><div class="panel"><div class="head"><div class="brand">GENQUNTAA AI</div><div class="status" id="status">Desktop Copilot</div></div><div class="question" id="question">Ready. Waiting for an interviewer question…</div><div class="answer" id="answer">Open Live Copilot and start the microphone.</div><div class="meta"><span id="confidence">Confidence —</span><div class="sources" id="sources"></div></div><div class="actions"><button id="live">Open Live</button><button class="secondary" id="workspace">Workspace</button><button class="secondary" id="hide">Hide</button></div></div><script>
const status=document.getElementById('status');
const question=document.getElementById('question');
const answer=document.getElementById('answer');
const confidence=document.getElementById('confidence');
const sources=document.getElementById('sources');
function render(data){
  if(!data||typeof data!=='object')return;
  question.textContent=data.transcript||data.text||'Question detected';
  answer.textContent=data.answer||'Generating answer…';
  const value=typeof data.confidence==='number'?Math.round(data.confidence*100):null;
  confidence.textContent=value===null?'Confidence —':`Confidence ${value}% · ${data.confidence_label||'Pending'}`;
  sources.replaceChildren();
  (data.sources||[]).slice(0,4).forEach(name=>{const el=document.createElement('span');el.className='source';el.textContent=name;sources.appendChild(el)});
  status.textContent=data.question_type?`Auto-answer · ${data.question_type}`:'Question detected';
}
window.genquantaa.onCopilotUpdate(render);
document.getElementById('live').onclick=()=>window.genquantaa.openLive();
document.getElementById('workspace').onclick=()=>window.genquantaa.openWorkspace();
document.getElementById('hide').onclick=()=>window.genquantaa.toggleOverlay();
</script></body></html>
